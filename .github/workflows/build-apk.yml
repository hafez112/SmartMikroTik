name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev automake \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libgl1-mesa-dev libgles2-mesa-dev \
          xclip xsel libltdl-dev
    
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36
    
    - name: Setup Android SDK (Buildozer compatible)
      run: |
        SDK_DIR=~/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_DIR
        cd $SDK_DIR
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        
        # Create tools/bin where Buildozer expects sdkmanager
        mkdir -p tools/bin
        cp cmdline-tools/bin/sdkmanager tools/bin/sdkmanager
        cp -r cmdline-tools/lib tools/lib
        
        # Accept licenses
        yes | tools/bin/sdkmanager --licenses || true
        tools/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true
    
    - name: Build APK
      run: buildozer android debug
      timeout-minutes: 90
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SmartMikroTik-APK
        path: bin/*.apk
