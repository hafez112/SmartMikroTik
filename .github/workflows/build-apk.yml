name: Build APK Fast

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Docker (pre-built SDL2)
      run: |
        docker run --rm \
          -v $(pwd):/home/user/app \
          -w /home/user/app \
          -e BUILDOZER_ALLOW_ROOT=1 \
          kivy/buildozer:latest \
          sh -c "buildozer android debug"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SmartMikroTik-APK
        path: bin/*.apk
